name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Server tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (server + build + static extension checks)
        run: pytest -q -m "not dom"

  extension:
    name: Extension tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both extensions
        run: |
          python scripts/build-extensions.py --check
          python scripts/build-extensions.py
      - name: Check JavaScript syntax
        run: for file in extensions/shared/*.js; do node --check "$file"; done
      - name: Install jsdom
        run: npm install --no-audit --no-fund
      - name: DOM tests (content.js against a simulated page)
        run: node tests/extension_dom_test.mjs
      - name: DOM tests (admin panel against a simulated browser)
        run: node tests/webui_dom_test.mjs
      - name: Validate the Firefox package (Mozilla web-ext)
        run: npx --yes web-ext@8 lint --source-dir dist/firefox
      - name: Upload built extensions
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: dist/
          retention-days: 14

  demo:
    name: Chrome-free smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r server/requirements.txt
      - name: Demo (mock browser)
        run: |
          ./scripts/demo.sh > /tmp/demo.log 2>&1 || { cat /tmp/demo.log; exit 1; }
          grep -q '"object": "chat.completion"' /tmp/demo.log
          grep -q 'chat.completion.chunk' /tmp/demo.log
          grep -q '"connected": true' /tmp/demo.log
